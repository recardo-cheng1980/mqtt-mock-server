services:
  mqtt-broker:
    build: .
    ports:
      - "8443:8443"
      - "3000:3000"
    volumes:
      - /etc/app/certs:/app/certs:ro
      - /home/ext_recardo_cheng_gmail_com/avc-report:/app/avc-reports
      - /etc/app/certs/.env:/app/.env:ro
    environment:
      # /api/ssh-sign — values come from Portainer's stack environment
      # config (or a host-side .env untracked by git), never committed here.
      # Endpoint fails closed (503) if these are unset, see mqtt.js.
      - VAULT_ADDR=${VAULT_ADDR:-}
      - VAULT_TOKEN=${VAULT_TOKEN:-}
      - VAULT_SSH_MOUNT=${VAULT_SSH_MOUNT:-ssh}
      - VAULT_SSH_ROLE=${VAULT_SSH_ROLE:-user-login}
      - SSH_SIGN_API_KEY=${SSH_SIGN_API_KEY:-}
      # Device-commission (Endpoint A, over MQTT :8443) — mints role_id/
      # secret_id for the shared my-app-role AppRole. Dedicated token, scoped
      # to only auth/approle/role/my-app-role/{role-id,secret-id} — see
      # docs/kms/provision-server-commission-endpoint-plan.md in uct-iq9075.
      - VAULT_COMMISSION_TOKEN=${VAULT_COMMISSION_TOKEN:-}
      - VAULT_APPROLE_ROLE=${VAULT_APPROLE_ROLE:-my-app-role}
      # Exact Issuer CN of the pki_idevid mount's signing cert (e.g. via
      # `vault read pki_idevid/cert/ca | openssl x509 -noout -issuer`) — the
      # broker's ca: list trusts both the operational and IDevID CAs, so this
      # is what actually distinguishes "this cert came from the IDevID CA"
      # from "this cert's CN just happens to match the naming pattern".
      - IDEVID_CA_ISSUER_CN=${IDEVID_CA_ISSUER_CN:-}
      # IDevID issuance (Endpoint B, POST /api/idevid-issue/:deviceId) —
      # operator-facing, plain HTTPS, separate dedicated Vault PKI mount from
      # the operational pki/sign/gateway mount (factory/enrollment CA kept
      # distinct from the operational CA per docs/dual-identities-and-reset-recovery.md).
      - VAULT_IDEVID_PKI_TOKEN=${VAULT_IDEVID_PKI_TOKEN:-}
      - VAULT_IDEVID_PKI_MOUNT=${VAULT_IDEVID_PKI_MOUNT:-pki_idevid}
      - VAULT_IDEVID_PKI_ROLE=${VAULT_IDEVID_PKI_ROLE:-idevid}
      - VAULT_IDEVID_TTL=${VAULT_IDEVID_TTL:-87600h}
      - IDEVID_ISSUE_API_KEY=${IDEVID_ISSUE_API_KEY:-}
      # SSH host-identity issuance (POST /api/ssh-host-issue/:deviceId) and
      # CA pubkey fetch (GET /api/ssh-ca-pubkey) — operator-facing,
      # production-line provisioning for /var/persist/ssh-trust/ on the
      # device. Reuses VAULT_SSH_MOUNT/VAULT_SSH_ROLE above (same mount+role
      # as /api/ssh-sign) rather than a dedicated mount/role — that role's
      # Vault config must permit both cert_type user and host certs. Gated
      # by the same SSH_SIGN_API_KEY as /api/ssh-sign (no separate key). See
      # docs/kms/ssh-ca-user-and-host-certs-plan.md in uct-iq9075.
      - VAULT_SSH_HOST_TTL=${VAULT_SSH_HOST_TTL:-87600h}
    restart: always
