services:
  mqtt-broker:
    build: .
    ports:
      - "8443:8443"
      - "3000:3000"
    volumes:
      - /etc/app/certs:/app/certs:ro
      - /home/ext_recardo_cheng_gmail_com/avc-report:/app/avc-reports
      - /home/ext_recardo_cheng_gmail_com/commission-state:/app/commission-state
      - /etc/app/certs/.env:/app/.env:ro
    environment:
      # /api/ssh-sign — values come from Portainer's stack environment
      # config (or a host-side .env untracked by git), never committed here.
      # Endpoint fails closed (503) if these are unset, see mqtt.js.
      - VAULT_ADDR=${VAULT_ADDR:-}
      - VAULT_TOKEN=${VAULT_TOKEN:-}
      - VAULT_SSH_MOUNT=${VAULT_SSH_MOUNT:-ssh}
      # /api/ssh-sign uses a fixed role and dedicated Vault token for each
      # target-bound client role. Do not use VAULT_TOKEN for user-cert
      # issuance; that token remains available to the read-only CA endpoint.
      - VAULT_SSH_ROLE_HOST_ADMIN=${VAULT_SSH_ROLE_HOST_ADMIN:-}
      - VAULT_SSH_TOKEN_HOST_ADMIN=${VAULT_SSH_TOKEN_HOST_ADMIN:-}
      - VAULT_SSH_TTL_HOST_ADMIN=${VAULT_SSH_TTL_HOST_ADMIN:-1440m}
      - VAULT_SSH_ROLE_OT_ADMIN=${VAULT_SSH_ROLE_OT_ADMIN:-}
      - VAULT_SSH_TOKEN_OT_ADMIN=${VAULT_SSH_TOKEN_OT_ADMIN:-}
      - VAULT_SSH_TTL_OT_ADMIN=${VAULT_SSH_TTL_OT_ADMIN:-1440m}
      - VAULT_SSH_ROLE_OT_OPERATOR=${VAULT_SSH_ROLE_OT_OPERATOR:-}
      - VAULT_SSH_TOKEN_OT_OPERATOR=${VAULT_SSH_TOKEN_OT_OPERATOR:-}
      - VAULT_SSH_TTL_OT_OPERATOR=${VAULT_SSH_TTL_OT_OPERATOR:-1440m}
      - VAULT_SSH_ROLE_AUDITOR=${VAULT_SSH_ROLE_AUDITOR:-}
      - VAULT_SSH_TOKEN_AUDITOR=${VAULT_SSH_TOKEN_AUDITOR:-}
      - VAULT_SSH_TTL_AUDITOR=${VAULT_SSH_TTL_AUDITOR:-1440m}
      - VAULT_SSH_ROLE_IT_ADMIN=${VAULT_SSH_ROLE_IT_ADMIN:-}
      - VAULT_SSH_TOKEN_IT_ADMIN=${VAULT_SSH_TOKEN_IT_ADMIN:-}
      - VAULT_SSH_TTL_IT_ADMIN=${VAULT_SSH_TTL_IT_ADMIN:-1440m}
      - VAULT_SSH_ROLE_DMZ_ADMIN=${VAULT_SSH_ROLE_DMZ_ADMIN:-}
      - VAULT_SSH_TOKEN_DMZ_ADMIN=${VAULT_SSH_TOKEN_DMZ_ADMIN:-}
      - VAULT_SSH_TTL_DMZ_ADMIN=${VAULT_SSH_TTL_DMZ_ADMIN:-1440m}
      # Plane-specific SSH APIs. These are additive to the legacy variables
      # above. Each plane has an isolated user CA and host CA mount. All eight
      # public CA reads use one read-only Vault token; signing tokens remain
      # separate and are never used for CA reads.
      - VAULT_SSH_CA_READ_TOKEN=${VAULT_SSH_CA_READ_TOKEN:-}
      - VAULT_SSH_USER_MOUNT_HOST=${VAULT_SSH_USER_MOUNT_HOST:-ssh_user_host}
      - VAULT_SSH_USER_ROLE_HOST_ADMIN=${VAULT_SSH_USER_ROLE_HOST_ADMIN:-}
      - VAULT_SSH_USER_TOKEN_HOST_ADMIN=${VAULT_SSH_USER_TOKEN_HOST_ADMIN:-}
      - VAULT_SSH_USER_TTL_HOST_ADMIN=${VAULT_SSH_USER_TTL_HOST_ADMIN:-1440m}
      - VAULT_SSH_USER_ROLE_AUDITOR=${VAULT_SSH_USER_ROLE_AUDITOR:-}
      - VAULT_SSH_USER_TOKEN_AUDITOR=${VAULT_SSH_USER_TOKEN_AUDITOR:-}
      - VAULT_SSH_USER_TTL_AUDITOR=${VAULT_SSH_USER_TTL_AUDITOR:-1440m}
      - VAULT_SSH_USER_MOUNT_OTNS=${VAULT_SSH_USER_MOUNT_OTNS:-ssh_user_otns}
      - VAULT_SSH_USER_ROLE_OT_ADMIN=${VAULT_SSH_USER_ROLE_OT_ADMIN:-}
      - VAULT_SSH_USER_TOKEN_OT_ADMIN=${VAULT_SSH_USER_TOKEN_OT_ADMIN:-}
      - VAULT_SSH_USER_TTL_OT_ADMIN=${VAULT_SSH_USER_TTL_OT_ADMIN:-1440m}
      - VAULT_SSH_USER_ROLE_OT_OPERATOR=${VAULT_SSH_USER_ROLE_OT_OPERATOR:-}
      - VAULT_SSH_USER_TOKEN_OT_OPERATOR=${VAULT_SSH_USER_TOKEN_OT_OPERATOR:-}
      - VAULT_SSH_USER_TTL_OT_OPERATOR=${VAULT_SSH_USER_TTL_OT_OPERATOR:-1440m}
      - VAULT_SSH_USER_MOUNT_DMZNS=${VAULT_SSH_USER_MOUNT_DMZNS:-ssh_user_dmzns}
      - VAULT_SSH_USER_ROLE_DMZ_ADMIN=${VAULT_SSH_USER_ROLE_DMZ_ADMIN:-}
      - VAULT_SSH_USER_TOKEN_DMZ_ADMIN=${VAULT_SSH_USER_TOKEN_DMZ_ADMIN:-}
      - VAULT_SSH_USER_TTL_DMZ_ADMIN=${VAULT_SSH_USER_TTL_DMZ_ADMIN:-1440m}
      - VAULT_SSH_USER_MOUNT_ITNS=${VAULT_SSH_USER_MOUNT_ITNS:-ssh_user_itns}
      - VAULT_SSH_USER_ROLE_IT_ADMIN=${VAULT_SSH_USER_ROLE_IT_ADMIN:-}
      - VAULT_SSH_USER_TOKEN_IT_ADMIN=${VAULT_SSH_USER_TOKEN_IT_ADMIN:-}
      - VAULT_SSH_USER_TTL_IT_ADMIN=${VAULT_SSH_USER_TTL_IT_ADMIN:-1440m}
      - VAULT_SSH_HOST_MOUNT_HOST=${VAULT_SSH_HOST_MOUNT_HOST:-ssh_host_host}
      - VAULT_SSH_HOST_ROLE_HOST=${VAULT_SSH_HOST_ROLE_HOST:-}
      - VAULT_SSH_HOST_TOKEN_HOST=${VAULT_SSH_HOST_TOKEN_HOST:-}
      - VAULT_SSH_HOST_TTL_HOST=${VAULT_SSH_HOST_TTL_HOST:-24h}
      - VAULT_SSH_HOST_MOUNT_OTNS=${VAULT_SSH_HOST_MOUNT_OTNS:-ssh_host_otns}
      - VAULT_SSH_HOST_ROLE_OTNS=${VAULT_SSH_HOST_ROLE_OTNS:-}
      - VAULT_SSH_HOST_TOKEN_OTNS=${VAULT_SSH_HOST_TOKEN_OTNS:-}
      - VAULT_SSH_HOST_TTL_OTNS=${VAULT_SSH_HOST_TTL_OTNS:-24h}
      - VAULT_SSH_HOST_MOUNT_DMZNS=${VAULT_SSH_HOST_MOUNT_DMZNS:-ssh_host_dmzns}
      - VAULT_SSH_HOST_ROLE_DMZNS=${VAULT_SSH_HOST_ROLE_DMZNS:-}
      - VAULT_SSH_HOST_TOKEN_DMZNS=${VAULT_SSH_HOST_TOKEN_DMZNS:-}
      - VAULT_SSH_HOST_TTL_DMZNS=${VAULT_SSH_HOST_TTL_DMZNS:-24h}
      - VAULT_SSH_HOST_MOUNT_ITNS=${VAULT_SSH_HOST_MOUNT_ITNS:-ssh_host_itns}
      - VAULT_SSH_HOST_ROLE_ITNS=${VAULT_SSH_HOST_ROLE_ITNS:-}
      - VAULT_SSH_HOST_TOKEN_ITNS=${VAULT_SSH_HOST_TOKEN_ITNS:-}
      - VAULT_SSH_HOST_TTL_ITNS=${VAULT_SSH_HOST_TTL_ITNS:-24h}
      # Temporary migration only. Keep false after DUT principals move from
      # admin@<device_id> to host-admin@<device_id>.
      - SSH_SIGN_ALLOW_LEGACY_ADMIN=${SSH_SIGN_ALLOW_LEGACY_ADMIN:-false}
      - VAULT_SSH_ROLE_LEGACY_ADMIN=${VAULT_SSH_ROLE_LEGACY_ADMIN:-}
      - VAULT_SSH_TOKEN_LEGACY_ADMIN=${VAULT_SSH_TOKEN_LEGACY_ADMIN:-}
      - VAULT_SSH_TTL_LEGACY_ADMIN=${VAULT_SSH_TTL_LEGACY_ADMIN:-1440m}
      - SSH_SIGN_API_KEY=${SSH_SIGN_API_KEY:-}
      # Device-commission (Endpoint A, over MQTT :8443) — mints role_id/
      # secret_id for the shared my-app-role AppRole. Dedicated token, scoped
      # to only auth/approle/role/my-app-role/{role-id,secret-id} — see
      # docs/kms/provision-server-commission-endpoint-plan.md in uct-iq9075.
      - VAULT_COMMISSION_TOKEN=${VAULT_COMMISSION_TOKEN:-}
      - VAULT_APPROLE_ROLE=${VAULT_APPROLE_ROLE:-my-app-role}
      # Exact Issuer CN of the pki_idevid mount's signing cert (e.g. via
      # `vault read pki_idevid/cert/ca | openssl x509 -noout -issuer`) — the
      # broker's ca: list trusts both the operational and IDevID CAs, so this
      # is what actually distinguishes "this cert came from the IDevID CA"
      # from "this cert's CN just happens to match the naming pattern".
      - IDEVID_CA_ISSUER_CN=${IDEVID_CA_ISSUER_CN:-}
      # IDevID issuance (Endpoint B, POST /api/idevid-issue/:deviceId) —
      # operator-facing, plain HTTPS, separate dedicated Vault PKI mount from
      # the operational pki/sign/gateway mount (factory/enrollment CA kept
      # distinct from the operational CA per docs/dual-identities-and-reset-recovery.md).
      - VAULT_IDEVID_PKI_TOKEN=${VAULT_IDEVID_PKI_TOKEN:-}
      - VAULT_IDEVID_PKI_MOUNT=${VAULT_IDEVID_PKI_MOUNT:-pki_idevid}
      - VAULT_IDEVID_PKI_ROLE=${VAULT_IDEVID_PKI_ROLE:-idevid}
      - VAULT_IDEVID_TTL=${VAULT_IDEVID_TTL:-87600h}
      - IDEVID_ISSUE_API_KEY=${IDEVID_ISSUE_API_KEY:-}
      # Server-initiated commissioning command/status API intentionally uses
      # IDEVID_ISSUE_API_KEY above (operator-approved shared credential).
      - COMMISSION_STATE_DIR=/app/commission-state
      # SSH host-identity issuance (POST /api/ssh-host-issue/:deviceId) —
      # operator-facing, production-line provisioning of
      # /var/persist/ssh-trust/host/ on the device. Reuses VAULT_SSH_MOUNT
      # above (same "ssh" mount as /api/ssh-sign) but a DEDICATED role,
      # VAULT_SSH_HOST_ROLE — confirmed 2026-07-31 that Vault rejects
      # cert_type 'host' against the user-login role ("cert_type 'host' is
      # not allowed by role"); the real, already-provisioned "host-cert"
      # role has allow_host_certificates=true, allow_user_certificates=false,
      # allowed_domains=csyang.org, allow_subdomains=true, max_ttl=8760h —
      # confirmed 2026-07-31 Vault hard-rejects ("ttl is larger than maximum
      # allowed") rather than silently capping an over-limit request, so
      # VAULT_SSH_HOST_TTL below defaults to 8760h to match; a longer-lived
      # cert needs the role's own max_ttl raised first.
      # Gated by the same SSH_SIGN_API_KEY as /api/ssh-sign (no separate
      # key). Uses a DEDICATED Vault token, VAULT_SSH_HOST_CERT_TOKEN —
      # deliberately narrower-scoped than VAULT_TOKEN, bound only to
      # ssh-host-cert-policy (create/update on ssh/sign/host-cert). GET
      # /api/ssh-ca-pubkey below is a separate concern and stays on the
      # broader VAULT_TOKEN (explicit operator decision, 2026-07-31 — the
      # new dedicated token is issuance-only). See
      # docs/kms/ssh-ca-user-and-host-certs-plan.md in uct-iq9075.
      - VAULT_SSH_HOST_CERT_TOKEN=${VAULT_SSH_HOST_CERT_TOKEN:-}
      - VAULT_SSH_HOST_ROLE=${VAULT_SSH_HOST_ROLE:-host-cert}
      - VAULT_SSH_HOST_TTL=${VAULT_SSH_HOST_TTL:-8760h}
      # GET /api/ssh-ca-pubkey — read-only, unauthenticated, uses VAULT_TOKEN
      # above (its policy already grants read on ssh/config/ca).
      # GET /api/logs auth gate — added 2026-07-31 after this endpoint was
      # found unauthenticated and leaking live Vault tokens/API keys via the
      # dotenv startup dump + per-request header logging (both now redacted
      # in code, this is defense in depth, not the only fix). Reuses the
      # same SSH_SIGN_API_KEY/X-SSH-Sign-Key already declared above rather
      # than a dedicated variable. Fails closed (503) if unset.
    restart: always
